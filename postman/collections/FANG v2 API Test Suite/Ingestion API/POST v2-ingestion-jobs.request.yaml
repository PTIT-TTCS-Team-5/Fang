$kind: http-request
name: POST /v2/ingestion/jobs
method: POST
url: "{{base_url}}/v2/ingestion/jobs"
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "jobAppId": {{job_app_id_full_cv}},
        "cvSnapUrl": "{{cv_snap_url}}"
    }
description: |-
  Trigger CV processing (parse -> chunk -> embed) for a known JobApplication.

  Expected assertions:
  - HTTP 202
  - indexJobId is integer > 0; save as {{ingestion_job_id}}
  - status is QUEUED
  - Do not run any DB reset/seed before or after this request
