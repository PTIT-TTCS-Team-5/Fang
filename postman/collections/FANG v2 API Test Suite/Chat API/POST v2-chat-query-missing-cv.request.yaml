$kind: http-request
name: 'POST /v2/chat/query — Missing CVPARSED'
method: POST
url: '{{base_url}}/v2/chat/query'
order: 1001
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "jobAppId": {{job_app_id_missing_cv}},
        "hrId": {{hr_id}},
        "prompt": "Ứng viên này có phù hợp không?",
        "conversationId": null,
        "modelMode": "auto-lite"
    }
description: |-
  Negative case: full-CV chat requires a usable CVPARSED row.

  Expected assertions:
  - HTTP 400
  - detail clearly states CV context/content is missing for jobAppId
  - No LLM/provider call should be visible in backend logs for this request
