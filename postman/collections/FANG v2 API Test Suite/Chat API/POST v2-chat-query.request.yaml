$kind: http-request
name: 'POST /v2/chat/query'
method: POST
url: '{{base_url}}/v2/chat/query'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "jobAppId": {{job_app_id_full_cv}},
        "hrId": {{hr_id}},
        "prompt": "Dựa trên toàn bộ CV, ứng viên này phù hợp với vị trí ở những điểm nào? Nêu evidence theo nguồn.",
        "conversationId": null,
        "modelMode": "auto-lite"
    }
description: |-
  Chat full-CV happy path. This API no longer requires AIINDEXJOB SUCCESS;
  it requires a usable CVPARSED row for {{job_app_id_full_cv}}.

  Expected assertions:
  - HTTP 200
  - conversationId is UUID; save as {{conversation_id}}
  - messageId is integer > 0
  - response is non-empty Vietnamese text
  - modelMode equals request modelMode
  - topK equals 0
  - contextWarning is null or has type, usedPercent, options
  - fallbackPath is null/string
