$kind: http-request
name: 'POST /v2/chat/conversations/{id}/branch-new'
method: POST
url: '{{base_url}}/v2/chat/conversations/{{conversation_id}}/branch-new'
order: 5000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '{{conversation_id}}'
description: |-
  Create a new conversation with summary from old one.

  Expected assertions:
  - HTTP 200 when source conversation has messages
  - newConversationId is UUID and different from {{conversation_id}}
  - summaryMessageId is integer > 0
