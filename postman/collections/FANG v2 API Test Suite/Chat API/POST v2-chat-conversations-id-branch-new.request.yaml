order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "conversationId": "a1b2c3d4-5e6f-7890-abcd-ef1234567890",
        "hrId": 1
    }
pathVariables:
